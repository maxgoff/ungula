services:
  ungula:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ungula-data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/api/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    profiles:
      - redis
    restart: unless-stopped

volumes:
  ungula-data:
  redis-data:
