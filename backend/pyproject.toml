[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ungula"
version = "0.1.0"
description = "Autonomous AI agent system with multi-model orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Max Goff"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    "alembic>=1.13.0",
    "httpx>=0.26.0",
    "redis>=5.0.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "discord.py>=2.3.0",
    "python-telegram-bot>=21.0",
    "anthropic>=0.18.0",
    "openai>=1.10.0",
    "google-genai>=1.0.0",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    # Rate limiting
    "slowapi>=0.1.8",
    # Token counting for context compaction
    "tiktoken>=0.5.0",
    # File watching for memory auto-indexing
    "watchdog>=3.0.0",
    # Slack integration
    "slack-bolt>=1.18.0",
    # Cron expression parsing
    "croniter>=1.4.0",
    # Docker sandbox
    "docker>=7.0.0",
    # Template rendering for webhooks
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
ungula = "ungula.main:run"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
